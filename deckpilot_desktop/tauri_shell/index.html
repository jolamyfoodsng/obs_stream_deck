<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeckPilot Desktop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <div class="panel">
        <p class="eyebrow">DeckPilot Desktop</p>
        <h1>Starting local OBS runtime</h1>
        <p class="body">
          The native app is waiting for the DeckPilot desktop runtime to come
          online.
        </p>
        <div class="status-row">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Checking local runtime...</span>
        </div>
        <div class="actions">
          <button id="retry-button" type="button">Retry</button>
          <button id="open-button" type="button" disabled>Open local UI</button>
        </div>
        <p class="hint" id="hint-text">
          If startup takes too long, verify that `node` is installed and OBS is
          not already using the same port.
        </p>
      </div>
    </main>
    <script src="boot.js"></script>
  </body>
</html>
