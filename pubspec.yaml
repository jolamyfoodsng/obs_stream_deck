name: obs_stream_deck
description: Stream Deck style OBS remote controller for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  in_app_review: ^2.0.10
  mobile_scanner: ^6.0.7
  shared_preferences: ^2.3.2
  tutorial_coach_mark: ^1.2.13
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  image_path: assets/branding/launcher_icon_base.png
  adaptive_icon_foreground: assets/branding/adaptive_foreground.png
  adaptive_icon_background: '#061126'
  min_sdk_android: 21

flutter_native_splash:
  color: '#061126'
  color_dark: '#061126'
  image: assets/branding/splash_logo_dark.png
  image_dark: assets/branding/splash_logo_dark.png
  android_12:
    image: assets/branding/adaptive_foreground.png
    icon_background_color: '#061126'
    image_dark: assets/branding/adaptive_foreground.png
    icon_background_color_dark: '#061126'
