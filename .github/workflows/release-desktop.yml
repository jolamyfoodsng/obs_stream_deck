name: Release DeckPilot Desktop

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release source
        run: test -f deckpilot_desktop/src-tauri/tauri.conf.json
